selection:
  candidate_min_score: 1.8   # Segment recall floor before reranking
  viral_min_score: 6.5       # Clip-level floor after reranking
  relative_score_floor: 0.6  # Keep clips within 60% of the top score
  min_top_clips_to_keep: 3   # Avoid returning zero clips on weak source videos
  min_clip_duration: 6       # Allow shorter clips (6s minimum)
  max_clip_duration: 180     # Up to 3 minutes
  max_clips_to_export: 50    # Export up to 50 clips per video

scoring:
  output_scale: 15
  rerank:
    weights:
      hook: 0.24
      payoff: 0.18
      retention: 0.18
      shareability: 0.14
      information_density: 0.12
      production_quality: 0.10
      clarity: 0.04

tracking:
  model: "yolov8n-face.pt"
  smoothing: 0.1
  zoom_factor: 1.1
