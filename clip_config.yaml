# Config for Viral Factory
processing:
  gpu_acceleration: true
  proxy_resolution: "1920x1080"
  output_resolution: [1080, 1920]

# Fix Colors (HDR -> SDR)
ffmpeg_filters:
  tonemap: "zscale=transfer=linear:npl=100,format=yuv420p,tonemap=hable:desat=0,zscale=transfer=bt709,format=yuv420p"

transcription:
  model_size: "medium"
  min_wps: 1.8  # Lowered - captures more energetic speech

longform:
  min_segment_sec: 0.5
  min_silence_to_cut_sec: 0.5
  edge_pad_sec: 0.08
  word_snap_window_sec: 0.35
  audio_fade_sec: 0.03

