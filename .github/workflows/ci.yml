name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json
      - run: npm ci
      - run: npm --prefix webui ci
      - run: npm run test:node
      - run: python -m unittest discover -s tests -v
      - run: npm run typecheck:webui
      - if: runner.os == 'Linux'
        run: npm run build
      - if: runner.os == 'Windows'
        run: npm --prefix webui run build:fast

