name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Windows GitHub runners otherwise use a legacy console encoding, while the
# CLI emits user-facing Unicode status markers during fallback paths.
env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json
      # The unit suite exercises the caption renderer and long-form helpers.
      # Keep this deliberately small: full local installs also include ML
      # models and hardware runtimes that CI never needs.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy opencv-python-headless PyYAML
      - run: npm ci
      - run: npm --prefix webui ci
      - run: npm run test:node
      - run: python -m unittest discover -s tests -v
      - run: npm run typecheck:webui
      - if: runner.os == 'Linux'
        run: npm run build
      - if: runner.os == 'Windows'
        run: npm --prefix webui run build:fast
