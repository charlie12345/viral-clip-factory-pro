version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    groups:
      webui-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

